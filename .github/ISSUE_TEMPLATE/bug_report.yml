name: Bug report
description: Report a reproducible problem with desktop selection.
body:
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Windows build, Windhawk version, comctl32 version if known.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and result
      description: Include appearance settings and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Native selection and other mods
      description: Does selection work with this mod disabled? Mention other selection mods and Lively; compare with Lively closed if applicable.
    validations:
      required: true
